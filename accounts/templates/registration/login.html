{% extends 'extended_play/base.html' %}

{% block content %}
    <h1 class="display-4 fw-bold mb-4">Log In</h1>
    <form action="{% url 'accounts:login' %}" method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div class="alert alert-danger">
                Please correct the errors below.
                {{ form.non_field_errors }}
            </div>    
        {% endif %}

        <div class="mb-3">
            <label for="input_username" class="form-label">Username</label>
            <input type="text" class="form-control" id="input_username" autocomplete="username" name="username" placeholder="Username">
            {{ form.username.errors}}
        </div>

        <div class="mb-3">
            <label for="input_password" class="form-label">Password</label>
            <input type="password" id="input_password" class="form-control" name="password" placeholder="Password">
            {{ form.password.errors}}
        </div>
        <button type="submit" name="submit" class="btn btn-custom p-2">Log in</button>
    </form>

{% endblock content %}
