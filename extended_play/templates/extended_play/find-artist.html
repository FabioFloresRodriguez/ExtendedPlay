{% extends 'extended_play/base.html' %}

{% block content %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="d-flex" method="GET" action="{% url 'extended_play:find_artist' %}">
                    <div class="input-group">
                        <input class="form-control form-control-lg" type="text" name="q" value="{{ query }}" placeholder="Search for an artist" aria-label="Search" style="background-color: #ffffff; color: #4F3C62; border-color: #4F3C62; box-shadow: 0 0 0 0.25rem rgba(79, 60, 98, 0.50)">
                        <button class="btn btn-custom px-4" type="submit">
                                <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    {% if query %}
        <div class="followed-artists mt-3 mb-3">
            <div class="art-search-header border-bottom border-light d-flex align-items-center justify-content-start p-1 mb-1">
                <h3 class="display-6 fw-normal mb-0">Artists:</h3>
            </div>

            <div class="row row-cols-4 row-cols-md-4 g-4 mt-1">
                {% for artist in artists %}
                    <div class="col mt-1">
                        <div class="card custom-artist-body">
                            <div class="ratio ratio-1x1 mx-auto">
                                {% if artist.pfp %}
                                    <img src="{{ artist.pfp }}" class="img-fluid rounded-circle h-100 w-100" alt="{{ artist.name }} profile picture">
                                {% else %}
                                    <img src="/media/default_pfp.jpg" class="img-fluid rounded-circle h-100 w-100">
                                {% endif %}
                            </div>

                            <div class="card-body custom-body">
                                <h5 class="card-title fw-semibold"><a href="{% url 'extended_play:artist' artist.spotify_id %}" class="text-decoration-none link-body-emphasis">{{ artist.name }}</a></h5>
                            </div>
                        </div>     
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endif %}
{% endblock content %}
