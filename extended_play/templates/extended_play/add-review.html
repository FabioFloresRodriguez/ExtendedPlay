{% extends "extended_play/base.html" %}

{% block content %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <div class="album card border-0">
        <div class="album-information card mb-3 custom-artist-body">
            <div class="d-flex align-items-center position-relative flex-wrap flex-md-nowrap">
                <div class="flex-shrink-0 p-3" style="width: 100%; max-width: 300px; height: 100%; max-height: 300px;">
                    {% if album.cover_url %}
                        <img src="{{ album.cover_url }}" alt="{{ album.name }} Cover Art" class="img-fluid w-100" style="aspect-ratio: 1 / 1; object-fit: cover;">
                    {% else %}
                        <p>No cover available</p>
                    {% endif %}
                </div>

                <div class="card-body ms-2">
                    <h1 class="card-title display-1 fw-bold mb-0">{{ album.name }}</h1>
                    <h3 class="card-text display-5 fw-semibold text-muted ms-1"><a href="{% url 'extended_play:artist' album.artist_id %}" class="text-decoration-none link-body-emphasis display-5 fw-semibold text-muted">{{ album.artist_name }}</a></h3>
                </div>  
            </div>
        </div>
    </div>

    <form action="{% url 'extended_play:add_review' album.spotify_id %}" method="post">
        {% csrf_token %}
        <div class="rating-card p-2">
            <h3 class="display-6 fw-normal mb-0 me-auto">Review:</h3> 

            <hr class="border-light" style="opacity: 100%;">
            
            <div class="star-rating animated-stars display-6 fw-normal mb-0 me-auto">
                <input type="radio" id="star5" name="star_rating" value="5" {% if form.star_rating.value == 5 or form.star_rating.value == '5' %}checked{% endif %}>
                <label for="star5" class="bi bi-star-fill right-half"></label>
                
                <input type="radio" id="star4half" name="star_rating" value="4.5" {% if form.star_rating.value == 4.5 or form.star_rating.value == '4.5' %}checked{% endif %}>
                <label for="star4half" class="bi bi-star-fill left-half"></label>

                <input type="radio" id="star4" name="star_rating" value="4" {% if form.star_rating.value == 4 or form.star_rating.value == '4' %}checked{% endif %}>
                <label for="star4" class="bi bi-star-fill right-half"></label>
                
                <input type="radio" id="star3half" name="star_rating" value="3.5" {% if form.star_rating.value == 3.5 or form.star_rating.value == '3.5' %}checked{% endif %}>
                <label for="star3half" class="bi bi-star-fill left-half"></label>

                <input type="radio" id="star3" name="star_rating" value="3" {% if form.star_rating.value == 3 or form.star_rating.value == '3' %}checked{% endif %}>
                <label for="star3" class="bi bi-star-fill right-half"></label>
                
                <input type="radio" id="star2half" name="star_rating" value="2.5" {% if form.star_rating.value == 2.5 or form.star_rating.value == '2.5' %}checked{% endif %}>
                <label for="star2half" class="bi bi-star-fill left-half"></label>

                <input type="radio" id="star2" name="star_rating" value="2" {% if form.star_rating.value == 2 or form.star_rating.value == '2' %}checked{% endif %}>
                <label for="star2" class="bi bi-star-fill right-half"></label>
                
                <input type="radio" id="star1half" name="star_rating" value="1.5" {% if form.star_rating.value == 1.5 or form.star_rating.value == '1.5' %}checked{% endif %}>
                <label for="star1half" class="bi bi-star-fill left-half"></label>

                <input type="radio" id="star1" name="star_rating" value="1" {% if form.star_rating.value == 1 or form.star_rating.value == '1' %}checked{% endif %}>
                <label for="star1" class="bi bi-star-fill right-half"></label>
                
                <input type="radio" id="starhalf" name="star_rating" value="0.5" {% if form.star_rating.value == 0.5 or form.star_rating.value == '0.5' %}checked{% endif %}>
                <label for="starhalf" class="bi bi-star-fill left-half"></label>
            </div>
        </div>
        
        <div class="mb-3 p-2">
            {{ form.text }}
        </div>

        <button name="submit" class="btn btn-custom p-2">Save changes</button>
    </form>
{% endblock content %}
